<form class="card p-space-lg flex flex-col gap-space-md" data-postcode-form novalidate>
<div class="flex items-center gap-space-sm">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center text-primary-container"><span class="material-symbols-outlined">map</span></div>
<div class="flex flex-col">
<h3 class="font-headline-sm text-title-lg text-on-surface uppercase">Check Postcode Coverage</h3>
<span class="font-label-sm text-label-sm text-outline">Instant door-to-door confirmation</span>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="field-label" for="postcode-input">Enter your suburb or postcode</label>
<div class="flex items-center gap-space-xs">
<input class="field" id="postcode-input" name="q" placeholder="e.g. 3000, Box Hill, Clayton" type="text" autocomplete="postal-code" list="suburb-list"/>
<button class="px-space-md py-space-sm rounded-lg bg-primary-container hover:bg-primary-container/90 text-on-primary-container font-headline-sm text-label-lg uppercase tracking-wider shrink-0 transition-colors" type="submit">Verify</button>
</div>
<datalist id="suburb-list"></datalist>
</div>
<div class="p-space-sm rounded-xl bg-surface-container-low flex items-center gap-space-sm min-h-[64px]" data-postcode-feedback aria-live="polite">
<span class="material-symbols-outlined text-secondary text-xl">check_circle</span>
<div class="flex flex-col">
<span class="font-title-md text-label-lg text-on-surface">Complimentary Home Pickup Available</span>
<span class="text-xs text-on-surface-variant">Across {{suburbCount}} Melbourne suburbs. Type yours to confirm.</span>
</div>
</div>
<div class="flex items-center justify-between pt-space-xs text-xs font-label-sm text-outline">
<span>Keys2Drive Accredited</span>
<span>VicRoads Route Specialists</span>
</div>
</form>
