<!DOCTYPE html>
<html class="dark" lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{title}}</title>
<meta name="description" content="{{description}}"/>
<link rel="canonical" href="{{canonical}}"/>
<meta name="theme-color" content="#0c0e10"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="{{title}}"/>
<meta property="og:description" content="{{description}}"/>
<meta property="og:url" content="{{canonical}}"/>
<meta property="og:locale" content="en_AU"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;800;900&amp;family=Space+Grotesk:wght@400;600;700&amp;display=swap"/>

<link rel="stylesheet" href="/assets/styles.css"/>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "DrivingSchool",
  "name": "Safe-Gen Driving Academy",
  "telephone": "+61470452803",
  "areaServed": "Melbourne, Victoria, Australia",
  "address": { "@type": "PostalAddress", "addressLocality": "Melbourne", "addressRegion": "VIC", "addressCountry": "AU" },
  "openingHours": ["Mo-Fr 06:30-20:30", "Sa-Su 07:00-19:00"],
  "priceRange": "$75 - $795"
}
</script>
<script src="/assets/main.js" defer></script>
</head>
<body class="bg-background font-body-md text-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container pb-20 md:pb-0">
<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[60] btn-primary px-space-md py-space-sm text-label-lg">Skip to content</a>
{{header}}
<main id="main" class="w-full pt-20 bg-background min-h-screen">
{{content}}
</main>
{{footer}}
</body>
</html>
